<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step Together</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Палитра в стиле IQOS ILUMA: слейт + бирюза + фиолетовый */
    --bg:#0c101b;
    --bg2:#141a28;
    --card:#161d2c;
    --card2:#1c2437;
    --line:#28304a;
    --tq:#00d1d2;            /* бирюза */
    --vi:#7a5cff;            /* фиолетовый */
    --coral:#ff7a59;         /* тёплый акцент */
    --gold:#ffc65c;
    --text:#f4f3f7;
    --muted:#9b96a8;
    --grad:linear-gradient(135deg,#00d1d2 0%,#7a5cff 100%);
    --grad-warm:linear-gradient(135deg,#ff7a59 0%,#ffc65c 100%);
    --safe-top:var(--tg-safe-area-inset-top, env(safe-area-inset-top,0px));
    --safe-bottom:var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom,0px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  :root{--nav-h:88px}   /* высота нижней навигации, уточняется из JS */
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:
      radial-gradient(120% 55% at 100% 0%, rgba(122,92,255,.22), transparent 62%),
      radial-gradient(120% 55% at 0% 0%, rgba(0,209,210,.16), transparent 58%),
      radial-gradient(90% 40% at 50% 100%, rgba(122,92,255,.10), transparent 70%),
      var(--bg);
    color:var(--text);
    padding-top:calc(var(--safe-top) + 8px);
    overflow-x:hidden;
  }
  /* ВАЖНО: нижний отступ живёт на контентном контейнере, а не на body.
     У body с фиксированной высотой контент «вытекает» за границы, и
     padding-bottom body оказывается не под последним элементом — из-за
     этого навигация перекрывала последние кнопки/строки списка. */
  .wrap{max-width:620px;margin:0 auto;
    padding:0 16px calc(var(--nav-h) + 40px + var(--safe-bottom))}

  /* Заголовок */
  .app-head{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);
    display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px rgba(0,209,210,.28)}
  .app-head h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
  .app-head p{margin:1px 0 0;font-size:12px;color:var(--muted)}

  /* Карточки */
  .card{background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .card.d1{animation-delay:.05s}.card.d2{animation-delay:.1s}.card.d3{animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}

  /* Растение + прогресс */
  .hero{text-align:center;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:-40% -10% auto;height:180px;
    background:radial-gradient(60% 80% at 50% 0,rgba(0,209,210,.25),transparent 70%);pointer-events:none}
  .plant{font-size:78px;line-height:1;margin:2px 0 4px;position:relative;z-index:1;
    animation:sprout .7s cubic-bezier(.2,1.4,.4,1) both, bob 4s ease-in-out 1s infinite}
  @keyframes sprout{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .stage{font-weight:800;font-size:16px;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .bar{height:10px;border-radius:8px;background:#1b1922;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);
    box-shadow:0 0 12px rgba(0,209,210,.5);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

  /* Плитки статов */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .tile .n{font-size:24px;font-weight:800}
  .tile .n.tq{color:var(--tq)}.tile .n.coral{color:var(--coral)}
  .tile .l{font-size:11px;color:var(--muted);margin-top:3px}

  /* ---- Прогресс: bento-сетка в духе дашборда --------------------------- */
  .bento{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .bento>.w2{grid-column:span 2}
  .gc{position:relative;overflow:hidden;border-radius:22px;padding:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .gc::before{content:"";position:absolute;inset:-1px -1px auto;height:72px;pointer-events:none;
    background:radial-gradient(75% 100% at 50% 0,rgba(0,209,210,.13),transparent 72%)}
  .gc.vi::before{background:radial-gradient(75% 100% at 50% 0,rgba(122,92,255,.16),transparent 72%)}
  .gc>*{position:relative;z-index:1}
  .gl{font-size:11.5px;color:var(--muted);font-weight:600}
  .gv{font-size:29px;font-weight:800;letter-spacing:-.6px;line-height:1.05;margin-top:2px}
  .gv.sm{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;
    font-size:11px;font-weight:700;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);color:var(--muted)}
  .pill .ic{width:13px;height:13px}

  .hi{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hi h2{margin:2px 0 0;font-size:23px;font-weight:800;letter-spacing:-.4px}
  .hi .gl b{color:var(--tq)}
  .spark{display:block;width:100%;height:74px;margin:6px -2px -6px}

  .mini{display:flex;align-items:center;gap:10px}
  .mring{width:64px;height:64px;flex:none;position:relative}
  .mring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .mring circle{fill:none;stroke-linecap:round;stroke-width:8}
  .mring .bg{stroke:rgba(255,255,255,.08)}
  .mring .fg{stroke:url(#g-ring);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
  .mring .em .ic{width:24px;height:24px;color:var(--vi)}
  .mring .em{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;
    animation:bob 4s ease-in-out 1s infinite}

  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;
    height:118px;margin-top:14px}
  .bar7{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;
    justify-content:flex-end}
  .bar7 i{display:block;width:11px;border-radius:99px;background:linear-gradient(180deg,#00d1d2,#7a5cff);
    animation:grow .9s cubic-bezier(.2,.8,.2,1) both;min-height:5px}
  .bar7.zero i{background:rgba(255,255,255,.09)}
  .bar7 span{font-size:10px;color:var(--muted);font-weight:700}
  .bar7.max span{color:var(--tq)}
  .btip{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:3px 8px;font-size:10.5px;
    font-weight:800;white-space:nowrap}
  .barsw{position:relative}

  /* ---- Прогресс: кольцо стадии, полоса «сегодня», серия, календарь ---- */
  .phero{position:relative;overflow:hidden;text-align:center;padding:22px 18px 20px}
  .phero::after{content:"";position:absolute;inset:-45% -20% auto;height:210px;pointer-events:none;
    background:radial-gradient(58% 78% at 50% 0,rgba(0,209,210,.22),transparent 72%)}
  .ringwrap{position:relative;width:168px;height:168px;margin:2px auto 6px;z-index:1}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-linecap:round}
  .ring .rbg{stroke:rgba(255,255,255,.07);stroke-width:9}
  .ring .rfg{stroke:url(#g-ring);stroke-width:9;filter:drop-shadow(0 0 10px rgba(0,209,210,.45));
    transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
  .ringwrap .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;line-height:1;
    animation:sprout .7s cubic-bezier(.2,1.4,.4,1) both,bob 4s ease-in-out 1s infinite}
  .pstage{font-weight:800;font-size:19px;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:1}
  .pgoal{font-size:12.5px;color:var(--muted);margin-top:5px;position:relative;z-index:1}
  .pgoal b{color:var(--text)}

  .tdy{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;margin:12px 0;
    border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .tdy .tic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.06)}
  .tdy .tic .ic{width:21px;height:21px}
  .tdy .tt{flex:1;min-width:0}
  .tdy .tt b{font-size:14px;display:block}
  .tdy .tt span{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
  .tdy .go{flex:none;border:none;border-radius:12px;padding:10px 14px;font-weight:800;font-size:12.5px;
    background:var(--grad);color:#06222b;cursor:pointer}
  .tdy.ok{border-color:rgba(0,209,210,.35)} .tdy.ok .tic{background:rgba(0,209,210,.14)}
  .tdy.ok .tic .ic{color:var(--tq)}
  .tdy.wait{border-color:rgba(255,198,92,.35)} .tdy.wait .tic{background:rgba(255,198,92,.14)}
  .tdy.wait .tic .ic{color:var(--gold)}
  .tdy.bad{border-color:rgba(255,122,89,.4)} .tdy.bad .tic{background:rgba(255,122,89,.14)}
  .tdy.bad .tic .ic{color:var(--coral)}
  .tdy.none .tic .ic{color:var(--muted)}

  .dots{display:flex;gap:6px;margin-top:12px}
  .dots i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07)}
  .dots i.on{background:var(--grad)}
  .dots i.gold{background:var(--grad-warm)}
  .streak-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}

  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px;
    font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.3px}
  .day.empty{background:transparent;border:1px dashed rgba(255,255,255,.1);color:var(--muted)}
  .day.miss{background:rgba(255,122,89,.06);border:1px dashed rgba(255,122,89,.3);color:#c98d78}
  .calsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .calsum span{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:99px;padding:5px 11px}
  .calsum b{color:var(--text)}

  /* Календарь */
  .sec-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}
  .day{aspect-ratio:1;min-width:0;border-radius:12px;background:var(--bg2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;position:relative;transition:transform .15s}
  .day small{font-size:9px;color:var(--muted);font-weight:600}
  .day.p1{background:linear-gradient(160deg,#123f45,#0e3238);border-color:#1c5157}
  .day.p2{background:linear-gradient(160deg,#0a5f61,#08494b);border-color:#0a6d6f;color:#eafeff}
  .day.p3{background:var(--grad);border:none;color:#06222b}
  .day.pend{background:rgba(255,198,92,.12);border:1px dashed var(--gold);color:var(--gold)}
  .day.rej{background:rgba(255,90,90,.10);border:1px solid #6e3636;color:#ff9b9b}
  .day.today{outline:2px solid var(--tq);outline-offset:1px}
  .day.future{opacity:.3}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .lg-acc{background:var(--tq)}.lg-pend{background:var(--gold)}.lg-rej{background:#ff7a7a}

  /* Списки участников/команд */
  /* ---- Лидерборд: SVG-иконки, подиум лиг, шкалы очков ---------------- */
  .ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;color:var(--tq)}
  .sec-title.warm .ic{color:var(--gold)}
  .sec-title.vi .ic{color:var(--vi)}
  .lsub{font-size:11.5px;color:var(--muted);margin:3px 0 2px;line-height:1.4}

  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:14px;
    border-bottom:1px solid rgba(255,255,255,.1)}
  .pod{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .pod.p1{flex:1.22 1 0}
  .pod .crown{width:22px;height:22px;color:var(--gold);margin-bottom:-3px}
  .pod .av{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;
    font-weight:800;font-size:15px;color:#14121b;background:var(--grad);
    box-shadow:0 8px 20px rgba(0,209,210,.22)}
  .pod.p1 .av{width:60px;height:60px;border-radius:21px;font-size:17px;
    background:var(--grad-warm);box-shadow:0 10px 26px rgba(255,198,92,.3)}
  .pod .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.3;width:100%;
    padding:0 2px;
    min-height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical}
  .pod .pt{font-size:13px;font-weight:900;color:var(--tq)}
  .pod.p1 .pt{color:var(--gold)}
  .pod .base{width:100%;height:54px;margin-top:2px;border-radius:14px 14px 0 0;
    border:1px solid rgba(255,255,255,.09);border-bottom:none;display:grid;place-items:center;
    font-size:15px;font-weight:900;color:var(--muted);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.01));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .pod.p1 .base{height:78px;color:var(--gold);border-color:rgba(255,198,92,.38);
    background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02));
    box-shadow:inset 0 1px 0 rgba(255,198,92,.45)}
  .pod.p3 .base{height:42px}

  .brow{padding:12px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:none}
  .bhead{display:flex;align-items:center;gap:11px}
  .bhead .nm{flex:1;font-weight:700;font-size:14px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bhead .pts{font-weight:900;font-size:14px;color:var(--tq)}
  .lbar{height:5px;border-radius:99px;background:rgba(255,255,255,.06);margin:9px 0 0 37px;
    overflow:hidden}
  .lbar i{display:block;height:100%;border-radius:99px;background:var(--grad);
    animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{width:0}}
  .lchip{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:800;background:var(--bg2);color:var(--muted);
    border:1px solid var(--line)}
  .lchip.c1{background:var(--grad-warm);color:#2a1e05;border-color:transparent}
  .lchip.c2{background:linear-gradient(135deg,#dfe5ee,#9aa4b2);color:#20242c;border-color:transparent}
  .lchip.c3{background:linear-gradient(135deg,#e3a877,#b9764a);color:#2a1b10;border-color:transparent}

  /* SVG вместо эмодзи в аккордеонах, плитках и календаре */
  .acc-ic .ic{width:19px;height:19px;color:var(--tq)}
  details.acc[open] .acc-ic .ic{color:#0d1117}
  .tile .ti{display:flex;justify-content:center;margin-bottom:6px}
  .tile .ti .ic{width:17px;height:17px;color:var(--muted)}
  .tile.acc-tile .ti .ic{color:var(--tq)}
  .day small .ic{width:11px;height:11px;stroke-width:2.4}
  .legend .ic{width:12px;height:12px;vertical-align:-2px;margin-left:3px}
  .note .ic{width:16px;height:16px;color:var(--gold);vertical-align:-3px;margin-right:4px}
  .stepy .av .ic{width:22px;height:22px;color:var(--tq)}
  .lockmsg .lk .ic{width:52px;height:52px;color:var(--tq);stroke-width:1.4}
  .gift-ic{width:78px;height:78px;color:var(--gold);stroke-width:1.2;
    filter:drop-shadow(0 10px 26px rgba(255,198,92,.35));position:relative;z-index:1}
  .myst .mrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
  .myst .lchip{width:22px;height:22px;border-radius:7px;font-size:11px}
  .btn-grad .ic,.btn-ghost .ic{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .sec-title .ic{width:19px;height:19px}

  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .rk{width:28px;height:28px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;
    font-weight:800;font-size:13px;flex:0 0 auto}
  .rk.g1{background:var(--grad-warm);color:#3a2410}.rk.g2{background:#3a3646;color:#cfc9dd}
  .rk.g3{background:#33303c;color:#b89b7a}
  .item .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .pts{font-weight:800;color:var(--tq)}
  .item.me{background:rgba(0,209,210,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}

  .rankbig{display:flex;align-items:baseline;gap:8px;justify-content:center}
  .rankbig b{font-size:40px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Правила */
  .rule{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .rule:last-child{border-bottom:none}
  .rnum{flex:0 0 26px;height:26px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--tq)}
  .rule p{margin:2px 0 0;font-size:14px;line-height:1.4}
  .scoregrid{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin-top:10px}
  .scoregrid .k{color:var(--muted)}.scoregrid .v{font-weight:800;text-align:right}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
    font-size:12px;font-weight:700;
    background:var(--grad);color:#06222b;margin-bottom:4px}
  a.link{color:var(--tq);text-decoration:none}

  /* Реплика Stepy — цитата с левой полосой и аватаром */
  .stepy{display:flex;gap:10px;background:rgba(0,209,210,.07);border:1px solid rgba(0,209,210,.25);
    border-left:3px solid var(--tq);border-radius:0 14px 14px 0;padding:12px 14px;margin:12px 0}
  .stepy .av{font-size:26px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
  .stepy .tx{font-size:13.5px;line-height:1.5}
  .stepy .tx b{color:var(--tq)}
  .howto{counter-reset:st;display:grid;gap:10px;margin-top:8px}
  .howto .st{display:flex;gap:12px;align-items:flex-start}
  .howto .st::before{counter-increment:st;content:counter(st);flex:0 0 26px;height:26px;border-radius:8px;
    background:var(--grad);color:#06222b;font-weight:800;font-size:13px;display:grid;place-items:center}
  .howto .st div{font-size:13.5px;line-height:1.45;padding-top:3px}
  .note{background:rgba(255,198,92,.1);border:1px solid rgba(255,198,92,.35);border-radius:14px;
    padding:12px 14px;font-size:13px;line-height:1.5;color:#ffe1a6}
  /* Аккордеоны (правила / FAQ): свёрнутые секции с плавным раскрытием */
  details.acc{background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden;
    transition:border-color .25s}
  details.acc[open]{border-color:rgba(0,209,210,.45)}
  details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;
    gap:12px;padding:15px 16px;font-weight:700;font-size:14.5px;user-select:none;
    -webkit-user-select:none;transition:background .2s}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc summary:active{background:rgba(0,209,210,.06)}
  .acc-ic{flex:0 0 34px;height:34px;border-radius:11px;background:var(--bg2);
    border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
    transition:background .25s,border-color .25s}
  details.acc[open] .acc-ic{background:var(--grad);border:none}
  .acc-t{flex:1}
  .acc-t small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:1px}
  .chev{flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;
    color:var(--muted);transition:transform .3s cubic-bezier(.2,.8,.2,1),color .25s}
  .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  details.acc[open] .chev{transform:rotate(180deg);color:var(--tq)}
  .acc-body{padding:2px 16px 16px;animation:accIn .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .faq{padding:12px 0;border-bottom:1px solid var(--line)}
  .faq:last-child{border-bottom:none;padding-bottom:0}
  .faq .q2{font-weight:700;font-size:14px}
  .faq p{margin:5px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
  .btn-grad{background:var(--grad);color:#06222b;border:none;border-radius:14px;
    padding:13px 20px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
  .btn-ghost{background:transparent;color:var(--tq);border:1px solid var(--tq);border-radius:14px;
    padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:10px}

  /* Призы — загадочные карточки */
  .gift{font-size:74px;line-height:1;margin:4px 0 6px;position:relative;z-index:1;
    animation:sprout .7s cubic-bezier(.2,1.4,.4,1) both, shake 3.2s ease-in-out 1s infinite}
  @keyframes shake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-8deg)}94%{transform:rotate(8deg)}97%{transform:rotate(-4deg)}}
  .mysteries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .myst{margin:0;text-align:center;padding:20px 8px;position:relative;overflow:hidden}
  .myst .q{font-size:34px;font-weight:800;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .myst .ml{font-size:12px;font-weight:700;margin-top:6px}
  .myst .ms{font-size:10px;color:var(--muted);margin-top:2px}
  .myst::after{content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);
    transform:translateX(-100%);animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

  /* Нижняя навигация */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:8px 10px calc(8px + var(--safe-bottom));
    background:rgba(23,21,29,.86);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around}
  .nav button{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
    font-size:10.5px;font-weight:600;position:relative;transition:color .2s}
  .nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
  .nav button.on{color:var(--tq)}
  .nav button.on svg{transform:translateY(-2px) scale(1.12)}
  .nav button.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;
    background:var(--grad);box-shadow:0 0 10px var(--tq)}

  /* Блокировка «Прогресса» до старта марафона */
  .locked{position:relative}
  .locked .blurwrap{filter:blur(7px) saturate(.8);pointer-events:none;opacity:.7}
  .lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}
  .lockmsg .lk{font-size:56px;margin-bottom:10px;
    animation:bob 4s ease-in-out 1s infinite}
  .lockmsg .lt{font-weight:800;font-size:19px;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lockmsg .ls{color:var(--text);font-size:14px;margin-top:10px;line-height:1.55;max-width:320px}
  .lockmsg .chip{margin-top:16px;background:var(--grad);color:#06222b;font-weight:800;
    padding:9px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 22px rgba(0,209,210,.35)}

  .view{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .center{text-align:center;padding:56px 24px;color:var(--muted);line-height:1.5}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--tq);animation:sp .8s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<script>
const tg = window.Telegram?.WebApp;
try{
  tg?.ready(); tg?.expand();
  tg?.setHeaderColor?.("#0c101b"); tg?.setBackgroundColor?.("#0c101b");
  tg?.disableVerticalSwipes?.();
}catch(e){}
// initData читаем «лениво» при каждом запросе из нескольких источников:
//  1) SDK (window.Telegram.WebApp.initData) — основной путь;
//  2) URL-хэш #tgWebAppData=... — Telegram кладёт туда данные при запуске web_app.
//     На Telegram Desktop .initData иногда пустой, а в хэше данные есть;
//  3) query ?tgWebAppData=... — на всякий случай.
function getInit(){
  try{ const d=window.Telegram?.WebApp?.initData; if(d) return d; }catch(e){}
  try{ const raw=new URLSearchParams(location.hash.slice(1)).get("tgWebAppData"); if(raw) return raw; }catch(e){}
  try{ const raw=new URLSearchParams(location.search).get("tgWebAppData"); if(raw) return raw; }catch(e){}
  return "";
}
const BUILD="phone-login";
const BOTLINK="https://t.me/wegrowmarathon_bot";
// Сессия по номеру телефона (localStorage): выдаётся сервером после проверки в базе.
function session(){ try{ return localStorage.getItem("st_session")||""; }catch(e){ return ""; } }
function setSession(t){ try{ localStorage.setItem("st_session",t); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem("st_session"); }catch(e){} }
function openBot(){ try{ tg?.openTelegramLink?.(BOTLINK); }catch(e){ location.href=BOTLINK; } }
// Ждём до ~3с, пока initData появится (первый запуск), затем стартуем.
async function waitInit(ms=3000){
  const step=100; let waited=0;
  while(!getInit() && waited<ms){ await new Promise(r=>setTimeout(r,step)); waited+=step; }
  return getInit();
}
const haptic = (t="light")=>{ try{ tg?.HapticFeedback?.impactOccurred(t); }catch(e){} };
const hsel = ()=>{ try{ tg?.HapticFeedback?.selectionChanged(); }catch(e){} };

const FIT_A="https://play.google.com/store/apps/details?id=com.fitbit.FitbitMobile";
const FIT_I="https://apps.apple.com/us/app/fitbit-health-fitness/id462638897";
const FEEDBACK="https://t.me/DaryaPMI";
function openPC(){ try{ tg?.openTelegramLink?.(FEEDBACK); }catch(e){ location.href=FEEDBACK; } }
function openExt(u){ try{ if(tg?.openLink){ tg.openLink(u); return false; } }catch(e){} window.open(u,"_blank"); return false; }

async function api(path){
  const r = await fetch(path, {headers:{"X-Init-Data": getInit(), "X-Session": session()}});
  if(r.status===401){ clearSession(); renderLogin(); throw new Error("HTTP 401"); }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail||""; }catch(_){}
    throw new Error("HTTP "+r.status+(d?": "+d:"")); }
  return r.json();
}
async function postLogin(phone){
  const r = await fetch("/api/login",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({phone})});
  return r.json();
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const V=document.getElementById("view");
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function fmtDM(iso){ const p=String(iso).split("-"); return p[2]+"."+p[1]; }
function fmtFull(iso){ const [y,m,dd]=String(iso).split("-"); return parseInt(dd,10)+" "+MONTHS[parseInt(m,10)-1]+" "+y; }

function countUp(el,to,dur=900,fmt){
  const start=performance.now(), from=0;
  (function tick(t){
    const p=Math.min(1,(t-start)/dur), e=1-Math.pow(1-p,3);
    const v=Math.round(from+(to-from)*e);
    el.textContent=fmt?fmt(v):v;
    if(p<1)requestAnimationFrame(tick);
  })(start);
}

const STAGES=[{e:"🌱",n:"Семечко"},{e:"🌿",n:"Росток"},{e:"🪴",n:"Кустик"},{e:"🌳",n:"Дерево"},{e:"🌸",n:"Цветение"}];
function stageIndex(p,streak){ if(streak>=7||p>=50)return 4; if(p>=30)return 3; if(p>=15)return 2; if(p>=5)return 1; return 0; }
function pcls(p){ return p>=3?"p3":p>=2?"p2":p>=1?"p1":""; }
function rk(i){ return `<div class="rk ${i===0?'g1':i===1?'g2':i===2?'g3':''}">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>`; }

let renderGen=0;

// День недели по ISO-дате (0=Пн … 6=Вс) через конгруэнцию Целлера.
// Именно так, а не через new Date(): у участника западнее Ташкента
// разбор даты браузером сдвинул бы календарь на день.
function isoDow(iso){
  let [y,m,d]=String(iso).split("-").map(Number);
  if(m<3){ m+=12; y-=1; }
  const K=y%100, J=Math.floor(y/100);
  const h=(d+Math.floor(13*(m+1)/5)+K+Math.floor(K/4)+Math.floor(J/4)+5*J)%7;
  return (h+5)%7;
}
const nfmt=(n)=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");

// Полоса «сегодня»: статус дня + понятное следующее действие.
function todayStrip(d){
  const t=d.calendar.find(c=>c.is_today);
  const st=d.today_status;
  if(st==="accepted") return `<div class="tdy ok"><div class="tic">${ico("check")}</div>
    <div class="tt"><b>Сегодня засчитано</b><span>${nfmt(t?.steps||0)} шагов · +${t?.points||0} балл(а)</span></div></div>`;
  if(st==="pending") return `<div class="tdy wait"><div class="tic">${ico("hourglass")}</div>
    <div class="tt"><b>Результат на проверке</b><span>${nfmt(t?.steps||0)} шагов ждут подтверждения P&amp;C</span></div></div>`;
  if(st==="rejected") return `<div class="tdy bad"><div class="tic">${ico("cross")}</div>
    <div class="tt"><b>Результат отклонён</b><span>Проверь скриншот и пришли заново</span></div>

// Спарклайн шагов по дням марафона: плавная линия + заливка под ней.
function spark(vals){
  const W=300,H=74,P=6;
  if(vals.length<2) return "";
  const max=Math.max(...vals,1), min=Math.min(...vals);
  const lo=Math.max(0,min-(max-min||max)*0.6), rng=(max-lo)||1;   // без вырождения в полосу
  const pt=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),
                            H-P-((v-lo)/rng)*(H-2*P-10)]);
  // сглаживаем кубическими кривыми по средним точкам — линия без изломов
  let dpath=`M${pt[0][0].toFixed(1)},${pt[0][1].toFixed(1)}`;
  for(let i=1;i<pt.length;i++){
    const [x0,y0]=pt[i-1],[x1,y1]=pt[i],mx=(x0+x1)/2;
    dpath+=` C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const last=pt[pt.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${dpath} L${W-P},${H} L${P},${H} Z" fill="url(#g-area)" stroke="none"/>
    <path d="${dpath}" fill="none" stroke="url(#g-line)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="#fff"/>
  </svg>`;
}

// Столбики последних 7 дней с подписью на лучшем дне.
function week7(cal){
  const days=cal.filter(c=>!c.future).slice(-7);
  if(!days.length) return "";
  const WD=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
  const max=Math.max(...days.map(c=>c.steps||0),1);
  const bi=days.reduce((b,c,i)=>((c.steps||0)>(days[b].steps||0)?i:b),0);
  const bars=days.map((c,i)=>{
    const h=Math.round(((c.steps||0)/max)*88);
    return `<div class="bar7 ${c.steps?"":"zero"} ${i===bi&&c.steps?"max":""}">
      <i style="height:${Math.max(5,h)}px"></i><span>${WD[isoDow(c.date)]}</span></div>`;
  }).join("");
  const best=days[bi].steps||0;
  const tip=best?`<div class="btip" style="left:${((bi+0.5)/days.length*100).toFixed(1)}%;top:6px">
      ${nfmt(best)}</div>`:"";
  return `<div class="barsw">${tip}<div class="bars">${bars}</div></div>`;
}

    else if(c.status==="pending"){ base="pend"; badge=`<small>${ico("hourglass")}</small>`; }
    else if(c.status==="rejected"){ base="rej"; badge=`<small>${ico("cross")}</small>`; }
    else if(c.future){ base="empty"; }

        <circle class="fg" id="${id}" cx="40" cy="40" r="${R}"

        <div class="hi">
          <div><div class="gl">${hello},</div><h2>${esc(first)}</h2></div>
          <div class="pill">${ico("sparkle")}${d.total_points} балл(ов)</div>
        </div>

        ${spark(d.calendar.filter(c=>!c.future).map(c=>c.steps||0))}
      </div>

      <div class="gc d1">
        <div class="gl">Стадия растения</div>
        <div class="mini" style="margin-top:10px">
          ${ring("ring-stage",stagePct,st.e)}
          <div style="min-width:0"><div class="gv sm">${st.n}</div>
            <div class="gsub">${si<4?`ещё <b style="color:var(--text)">${Math.max(0,nextAt-d.total_points)}</b> б. до «${STAGES[si+1].n}»`
                                    :"максимальная стадия"}</div></div>
        </div>
      </div>

      <div class="gc vi d2">
        <div class="gl">Серия дней</div>
        <div class="mini" style="margin-top:10px">
          ${ring("ring-streak",streakPct,ico("flame"))}
          <div style="min-width:0"><div class="gv sm">${streak} дн.</div>
            <div class="gsub">${streak>=7?"бонус недели взят"
              :`до <b style="color:var(--text)">+${streak>=5?4:2}</b> ещё ${goalLeft} дн.`}</div></div>
        </div>
      </div>

      <div class="w2">${todayStrip(d)}</div>

      <div class="gc d1"><div class="gl">Шагов пройдено</div>
        <div class="gv" id="s-steps">0</div>
        <div class="gsub">принято дней: <b style="color:var(--text)">${acc.length}</b></div></div>

      <div class="gc d2"><div class="gl">Место в марафоне</div>
        <div class="gv">${d.rank?"#"+d.rank:"—"}</div>
        <div class="gsub">${d.participants?`из ${d.participants} участников`:"пока без рейтинга"}</div></div>

        <div class="row"><div class="sec-title">${ico("bolt")}Активность недели</div>
          <span class="pill">${ico("steps")}${nfmt(steps)}</span></div>
        ${week7(d.calendar)}

      <div class="gc w2 d3">
        <div class="row"><div class="sec-title">${ico("calendar")}Календарь марафона</div>
          <span class="muted">${fmtDM(d.marathon.start)}–${fmtDM(d.marathon.end)}</span></div>

        <div class="calsum">

          <span>принято <b>${acc.length}</b></span>
          ${missed?`<span>пропущено <b>${missed}</b></span>`:""}
          ${left?`<span>впереди <b>${left}</b> дн.</span>`:""}
        </div>
        <div class="legend">
          <span><i class="lg-acc"></i>принято</span>
          <span><i class="lg-pend"></i>на проверке</span>
          <span><i class="lg-rej"></i>отклонено</span>
        </div>
      </div>
    </div>`;

  // До старта марафона «Прогресс» заблюрен + дисклеймер. Считаем по
  // СЕРВЕРНЫМ флагам future (таймзона Ташкента), а не по часам клиента.
  const notStarted=d.calendar.length>0&&d.calendar.every(c=>c.future);
  const inner=notStarted
    ? `<div class="locked"><div class="blurwrap">${body}</div>

  requestAnimationFrame(()=>{

      if(r)r.style.strokeDashoffset=(C*(1-pct/100)).toFixed(1);};
    set("ring-stage",stagePct); set("ring-streak",streakPct);

const ico=(n,cls="")=>`<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const initials=(n)=>(((n||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join(""))||"?").toUpperCase();
const shortName=(n)=>((n||"").trim().split(/\s+/).slice(0,2).join(" ")||"—");
const secHead=(icon,title,sub,cls="")=>
  `<div class="sec-title ${cls}"><svg class="ic"><use href="#i-${icon}"/></svg>${title}</div>`+
  (sub?`<div class="lsub">${sub}</div>`:"");

// Подиум: 2-е место слева, 1-е по центру и выше, 3-е справа.
function podium(list){
  const l=list||[];
  if(!l.length) return emptyRow();
  return `<div class="podium">`+[1,0,2].filter(i=>l[i]).map(i=>{
    const p=l[i];
    return `<div class="pod p${i+1}">`+
      (i===0?`<svg class="ic crown"><use href="#i-crown"/></svg>`:"")+
      `<div class="av">${esc(initials(p.name))}</div>
       <div class="nm">${esc(shortName(p.name))}</div>
       <div class="pt">${p.points}</div>
       <div class="base">${i+1}</div></div>`;
  }).join("")+`</div>`;
}

// Строки со шкалой: длина полосы — доля от результата лидера.
function bars(list,people){
  const l=list||[];
  if(!l.length) return emptyRow();
  const max=Math.max(...l.map(x=>x.points),1);
  return l.map((x,i)=>`<div class="brow">
    <div class="bhead"><div class="lchip ${i<3?"c"+(i+1):""}">${i+1}</div>
      <div class="nm">${esc(people?shortName(x.name):(x.name||"—"))}</div>
      <div class="pts">${x.points}</div></div>
    <div class="lbar"><i style="width:${Math.max(x.points>0?6:0,Math.round(x.points/max*100))}%"></i></div>
  </div>`).join("");
}

      <svg class="ic gift-ic"><use href="#i-gift"/></svg>
      <div class="stage" style="font-size:18px">Призы держатся в секрете</div>
      <p class="muted" style="margin:10px auto 0;max-width:360px;line-height:1.5">
        Награды за марафон пока скрыты под покровом тайны 🤫<br>
        Дойди до финиша — и узнаешь, какой <b style="color:var(--text)">сюрприз</b> ждёт лучших.
        Обещаем: это стоит каждого шага ✨</p>
    </div>
    <div class="mysteries">
      ${[1,2,3].map(i=>`<div class="myst card d${i}"><div class="q">?</div>
        <div class="mrow"><div class="lchip c${i}">${i}</div><div class="ml">место</div></div>

    </div>
    <div class="card d3" style="text-align:center">

      <p class="muted" style="margin-top:10px;line-height:1.5">
        Стабильность и командный дух повышают шансы.<br>Двигайся каждый день — и будь в топе 🚀</p>
    </div></div>`;
}

  const qa=[
    [ico("steps"),"Как сдать шаги?","Жми «Шаги за сегодня», пришли <b>число</b>, затем <b>скриншот</b> из Google Health. Успей до <b>23:55</b>."],
    [ico("calendar"),"Что за еженедельный отчёт?","Каждое <b>воскресенье с 22:00 до 23:55</b> жми кнопку «📈 Еженедельный отчёт» в боте и пришли <b>скриншот недельной статистики</b> из Google Health. Это закрепляет серию и бонус за неделю. В другое время кнопка закрыта — бот напомнит."],
    [ico("hourglass"),"Почему баллы не начислились сразу?","Каждый результат проверяет P&C. В календаре день сначала <b>⏳ на проверке</b>, после подтверждения становится зелёным — и капают баллы."],
    [ico("target"),"Сколько баллов за день?","5 000–9 999 → <b>1</b>, 10 000–14 999 → <b>2</b>, 15 000–30 000 → <b>3</b>. Меньше 5 000 — 0 баллов."],
    [ico("flame"),"Что за серия и бонус?","Серия — дни <b>подряд</b> по 10 000+ шагов. 5 дней → <b>+2</b>, 7 дней → <b>+4</b> (по итогам недели). Пропуск обнуляет серию."],
    [ico("camera"),"Какой скриншот подойдёт?","Только из приложения Google Health: страница «Шаги» с фильтром <b>«Все источники»</b>, где видны <b>дата</b> и <b>число шагов</b> за сегодня. Скриншоты из других приложений не принимаются. Для недельного отчёта — экран со статистикой за неделю."],
    [ico("trophy"),"Где прогресс и лидерборд?","В приложении: табы «Прогресс» и «Лидерборд» — там растение, календарь и рейтинг команд."],
    [ico("cross"),"Результат отклонили — что делать?","Проверь данные и пришли заново кнопкой «Шаги за сегодня». Не помогло — напиши в обратную связь."],
  ];
  const items=qa.map(([ic,q,a])=>acc(ic,q,"",`<p style="margin:2px 0 4px;font-size:13.5px;line-height:1.5;color:var(--muted)">${a}</p>`)).join("");
  V.innerHTML=`<div class="view">
    <div class="card d1">
      <div class="sec-title">${ico("help")}Помощь</div>

    </div>
    ${items}
    <div class="card d3" style="text-align:center">
      <button class="btn-grad" onclick="show('rules')">${ico("list")}Открыть правила</button>

    </div></div>`;
}

const emptyRow=()=>`<div class="muted" style="padding:8px 0">— пока пусто —</div>`;
function regNotice(){ V.innerHTML=`<div class="center">Ты ещё не в марафоне 🌱<br><br>Открой бота и нажми <b>/start</b>, чтобы зарегистрироваться.
  <br><br><button class="btn-grad" style="max-width:220px;margin:0 auto" onclick="openBot()">Открыть бота</button></div>`; }

// Экран входа по номеру телефона (когда нет Telegram-авторизации).
function renderLogin(){
  V.innerHTML=`<div class="view"><div class="card d1" style="text-align:center">
    <div class="plant" style="font-size:52px">🪴</div>
    <div class="stage">Вход в Step Together</div>
    <p class="muted" style="margin:10px auto 16px;max-width:340px;line-height:1.5">
      Введи номер телефона, который ты указал при регистрации в боте — проверим по базе и откроем доступ.</p>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67"
      style="width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
      background:var(--bg2);color:var(--text);font-size:16px;text-align:center;
      -webkit-user-select:text;user-select:text;outline:none">
    <div id="lmsg" style="min-height:20px;margin:10px 0;font-size:13px;color:var(--gold)"></div>
    <button class="btn-grad" onclick="doLogin()">Войти</button>
    <button class="btn-ghost" onclick="openBot()">Я ещё не регистрировался — открыть бота</button>
  </div></div>`;
  const inp=document.getElementById("phone");
  inp?.addEventListener("keydown",e=>{ if(e.key==="Enter")doLogin(); });
  setTimeout(()=>inp?.focus(),100);
}
async function doLogin(){
  const el=document.getElementById("phone"), msg=document.getElementById("lmsg");
  if(!el) return;
  const phone=el.value.trim();
  if(phone.replace(/\D/g,"").length<9){ msg.textContent="Введите корректный номер телефона"; return; }
  msg.style.color="var(--muted)"; msg.textContent="Проверяю…";
  let d; try{ d=await postLogin(phone); }catch(e){ msg.style.color="var(--gold)"; msg.textContent="Ошибка сети, попробуй ещё раз"; return; }
  if(d.ok){
    setSession(d.token);
    Object.keys(loaded).forEach(k=>delete loaded[k]); V.dataset.tab="";
    haptic("medium"); show("progress"); return;
  }
  msg.style.color="var(--gold)";
  if(d.registered===false){
    msg.innerHTML="Этот номер не найден в базе 🌱 Сначала пройди регистрацию в боте (кнопка ниже).";
  } else if(d.reason==="disqualified"){
    msg.textContent="Доступ закрыт: участник дисквалифицирован.";
  } else if(d.reason==="bad_phone"){
    msg.textContent="Введите корректный номер телефона";
  } else if(d.reason==="rate_limited"){
    msg.textContent="Слишком много попыток. Подожди 10 минут и попробуй снова.";
  } else {
    msg.textContent="Не удалось войти. Проверь номер и попробуй снова.";
  }
}
function diagText(){
  const w=window.Telegram?.WebApp;
  let uid="—"; try{ uid=w?.initDataUnsafe?.user?.id ?? "—"; }catch(e){}
  const parts=[
    "build: "+BUILD,
    "tg: "+(w?"есть":"нет"),
    "platform: "+(w?.platform||"—"),
    "version: "+(w?.version||"—"),
    "initData.len: "+((w?.initData||"").length),
    "hash.tgWebAppData: "+(new URLSearchParams(location.hash.slice(1)).get("tgWebAppData")?"есть":"нет"),
    "initDataUnsafe.user.id: "+uid,
  ];
  return parts.join("\n");
}
function notice(e){
  if(!getInit() && !session()){
    V.innerHTML=`<div class="center">Открой это приложение <b>из бота</b> Step Together 🌱
      <br><br><button class="btn-grad" style="max-width:220px;margin:0 auto" onclick="retryInit()">Обновить</button>
      <pre style="text-align:left;white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px">${esc(diagText())}</pre>
      </div>`;
    return;
  }
  V.innerHTML=`<div class="center">Не удалось загрузить 😔<br><br><span class="muted">${esc(e&&e.message||e||"")}</span><br><br><button class="btn-grad" style="max-width:220px;margin:0 auto" onclick="retryInit()">🔄 Обновить</button>
    <pre style="text-align:left;white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px">${esc(diagText())}</pre></div>`;
}
async function retryInit(){
  V.innerHTML=`<div class="spin"></div>`;
  await waitInit(3000);
  loaded.progress=false; V.dataset.tab=""; show("progress");
}

const views={progress:renderProgress,team:renderTeam,board:renderBoard,rules:renderRules,prizes:renderPrizes,faq:renderFAQ};
const loaded={};
function show(tab){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="rules"||tab==="prizes"||tab==="faq"){ renderGen++; views[tab](); return; }   // статичны — всегда свежие
  if(loaded[tab]&&V.dataset.tab===tab) return;
  V.dataset.tab=tab; loaded[tab]=true; views[tab]();
}
document.querySelectorAll(".nav button").forEach(b=>{
  b.addEventListener("click",()=>{ hsel(); V.dataset.tab=""; show(b.dataset.tab); });
});
// Фактическая высота панели навигации → нижний отступ контента, чтобы кнопки
// в конце страниц никогда не пряталась под панелью (высота зависит от
// платформы, safe-area и масштаба шрифта).
function fitNavPadding(){
  const nav=document.getElementById("nav");
  if(nav) document.documentElement.style.setProperty("--nav-h", nav.offsetHeight+"px");
}
fitNavPadding();
window.addEventListener("resize",fitNavPadding);
try{ tg?.onEvent?.("viewportChanged",fitNavPadding); }catch(e){}
// Загрузка: если есть Telegram-авторизация или сохранённая сессия — сразу к
// прогрессу; иначе показываем вход по номеру телефона.
async function boot(){
  if(!window.Telegram?.WebApp && session()){ show("progress"); return; }
  await waitInit();
  if(getInit() || session()){ show("progress"); }
  else { renderLogin(); }
}
boot();
</script>
</body>
</html>
