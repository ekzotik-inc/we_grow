<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Unbounded:wght@700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<title>Step Together</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Палитра в стиле IQOS ILUMA: слейт + бирюза + фиолетовый */
    --bg:#0c101b;
    --bg2:#141a28;
    --card:#161d2c;
    --card2:#1c2437;
    --line:#28304a;
    --tq:#00d1d2;            /* бирюза */
    --vi:#7a5cff;            /* фиолетовый */
    --coral:#ff7a59;         /* тёплый акцент */
    --gold:#ffc65c;
    --text:#f4f3f7;
    --muted:#9b96a8;
    --grad:linear-gradient(135deg,#00d1d2 0%,#7a5cff 100%);
    --grad-warm:linear-gradient(135deg,#ff7a59 0%,#ffc65c 100%);
    --safe-top:var(--tg-safe-area-inset-top, env(safe-area-inset-top,0px));
    --safe-bottom:var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom,0px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  :root{--nav-h:88px}   /* высота нижней навигации, уточняется из JS */
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:
      radial-gradient(120% 55% at 100% 0%, rgba(122,92,255,.22), transparent 62%),
      radial-gradient(120% 55% at 0% 0%, rgba(0,209,210,.16), transparent 58%),
      radial-gradient(90% 40% at 50% 100%, rgba(122,92,255,.10), transparent 70%),
      var(--bg);
    color:var(--text);
    padding-top:calc(var(--safe-top) + 8px);
    overflow-x:hidden;
  }
  /* ВАЖНО: нижний отступ живёт на контентном контейнере, а не на body.
     У body с фиксированной высотой контент «вытекает» за границы, и
     padding-bottom body оказывается не под последним элементом — из-за
     этого навигация перекрывала последние кнопки/строки списка. */
  .wrap{max-width:620px;margin:0 auto;
    padding:0 16px calc(var(--nav-h) + 40px + var(--safe-bottom))}

  /* Заголовок */
  .app-head{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
  /* Эмблема: бегун на финише (SVG/SMIL-анимация — работает и в iOS) */
  .logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 6px 16px rgba(16,185,129,.35))}
  .logo svg{width:100%;height:100%;overflow:visible}
  .app-head h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,#fff 0%,#9ff3f3 45%,#c9bcff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .app-head p{margin:1px 0 0;font-size:12px;color:var(--muted)}

  /* Карточки */
  .card{background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .card.d1{animation-delay:.05s}.card.d2{animation-delay:.1s}.card.d3{animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}

  /* Растение + прогресс */
  .hero{text-align:center;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:-40% -10% auto;height:180px;
    background:radial-gradient(60% 80% at 50% 0,rgba(0,209,210,.25),transparent 70%);pointer-events:none}
  .plant{font-size:78px;line-height:1;margin:2px 0 4px;position:relative;z-index:1;
    animation:sprout .7s cubic-bezier(.2,1.4,.4,1) both, bob 4s ease-in-out 1s infinite}
  @keyframes sprout{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .stage{font-weight:800;font-size:16px;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .bar{height:10px;border-radius:8px;background:#1b1922;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);
    box-shadow:0 0 12px rgba(0,209,210,.5);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

  /* Плитки статов */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .tile .n{font-size:24px;font-weight:800}
  .tile .n.tq{color:var(--tq)}.tile .n.coral{color:var(--coral)}
  .tile .l{font-size:11px;color:var(--muted);margin-top:3px}

  /* ---- Прогресс: bento-сетка в духе дашборда --------------------------- */
  .bento{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .bento>.w2{grid-column:span 2}
  .gc{position:relative;overflow:hidden;border-radius:22px;padding:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .gc::before{content:"";position:absolute;inset:-1px -1px auto;height:72px;pointer-events:none;
    background:radial-gradient(75% 100% at 50% 0,rgba(0,209,210,.13),transparent 72%)}
  .gc.vi::before{background:radial-gradient(75% 100% at 50% 0,rgba(122,92,255,.16),transparent 72%)}
  .gc>*{position:relative;z-index:1}
  .gl{font-size:11.5px;color:var(--muted);font-weight:600}
  .gv{font-size:29px;font-weight:800;letter-spacing:-.6px;line-height:1.05;margin-top:2px}
  .gv.sm{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;
    font-size:11px;font-weight:700;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);color:var(--muted)}
  .pill .ic{width:13px;height:13px}

  .hi{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hi h2{margin:2px 0 0;font-size:23px;font-weight:800;letter-spacing:-.4px}
  .hi .gl b{color:var(--tq)}
  .spark{display:block;width:100%;height:74px;margin:6px -2px -6px}

  .mini{display:flex;align-items:center;gap:10px}
  .mring{width:64px;height:64px;flex:none;position:relative}
  .mring>svg{width:100%;height:100%;transform:rotate(-90deg)}
  .mring circle{fill:none;stroke-linecap:round;stroke-width:8}
  .mring .bg{stroke:rgba(255,255,255,.08)}
  .mring .fg{stroke:url(#g-ring);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
  .mring .em .ic{width:24px;height:24px;color:var(--vi)}
  .mring .em{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;
    animation:bob 4s ease-in-out 1s infinite}

  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;
    height:118px;margin-top:14px}
  .bar7{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;
    justify-content:flex-end}
  .bar7 i{display:block;width:11px;border-radius:99px;background:linear-gradient(180deg,#00d1d2,#7a5cff);
    animation:grow .9s cubic-bezier(.2,.8,.2,1) both;min-height:5px}
  .bar7.zero i{background:rgba(255,255,255,.09)}
  .bar7 span{font-size:10px;color:var(--muted);font-weight:700}
  .bar7.max span{color:var(--tq)}
  .btip{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:3px 8px;font-size:10.5px;
    font-weight:800;white-space:nowrap}
  .barsw{position:relative}

  /* ---- Прогресс: кольцо стадии, полоса «сегодня», серия, календарь ---- */
  .phero{position:relative;overflow:hidden;text-align:center;padding:22px 18px 20px}
  .phero::after{content:"";position:absolute;inset:-45% -20% auto;height:210px;pointer-events:none;
    background:radial-gradient(58% 78% at 50% 0,rgba(0,209,210,.22),transparent 72%)}
  .ringwrap{position:relative;width:168px;height:168px;margin:2px auto 6px;z-index:1}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-linecap:round}
  .ring .rbg{stroke:rgba(255,255,255,.07);stroke-width:9}
  .ring .rfg{stroke:url(#g-ring);stroke-width:9;filter:drop-shadow(0 0 10px rgba(0,209,210,.45));
    transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
  .ringwrap .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;line-height:1;
    animation:sprout .7s cubic-bezier(.2,1.4,.4,1) both,bob 4s ease-in-out 1s infinite}
  .pstage{font-weight:800;font-size:19px;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:1}
  .pgoal{font-size:12.5px;color:var(--muted);margin-top:5px;position:relative;z-index:1}
  .pgoal b{color:var(--text)}

  .tdy{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;margin:12px 0;
    border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .tdy .tic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.06)}
  .tdy .tic .ic{width:21px;height:21px}
  .tdy .tt{flex:1;min-width:0}
  .tdy .tt b{font-size:14px;display:block}
  .tdy .tt span{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
  .tdy .go{flex:none;border:none;border-radius:12px;padding:10px 14px;font-weight:800;font-size:12.5px;
    background:var(--grad);color:#06222b;cursor:pointer}
  .tdy.ok{border-color:rgba(0,209,210,.35)} .tdy.ok .tic{background:rgba(0,209,210,.14)}
  .tdy.ok .tic .ic{color:var(--tq)}
  .tdy.wait{border-color:rgba(255,198,92,.35)} .tdy.wait .tic{background:rgba(255,198,92,.14)}
  .tdy.wait .tic .ic{color:var(--gold)}
  .tdy.bad{border-color:rgba(255,122,89,.4)} .tdy.bad .tic{background:rgba(255,122,89,.14)}
  .tdy.bad .tic .ic{color:var(--coral)}
  .tdy.none .tic .ic{color:var(--muted)}

  .dots{display:flex;gap:6px;margin-top:12px}
  .dots i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07)}
  .dots i.on{background:var(--grad)}
  .dots i.gold{background:var(--grad-warm)}
  .streak-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}

  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px;
    font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.3px}
  .day.empty{background:transparent;border:1px dashed rgba(255,255,255,.1);color:var(--muted)}
  .day.miss{background:rgba(255,122,89,.06);border:1px dashed rgba(255,122,89,.3);color:#c98d78}
  .calsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .calsum span{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:99px;padding:5px 11px}
  .calsum b{color:var(--text)}

  /* Календарь */
  .sec-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}
  .day{aspect-ratio:1;min-width:0;border-radius:12px;background:var(--bg2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;position:relative;transition:transform .15s}
  .day small{font-size:9px;color:var(--muted);font-weight:600}
  .day.p1{background:linear-gradient(160deg,#123f45,#0e3238);border-color:#1c5157}
  .day.p2{background:linear-gradient(160deg,#0a5f61,#08494b);border-color:#0a6d6f;color:#eafeff}
  .day.p3{background:var(--grad);border:none;color:#06222b}
  .day.pend{background:rgba(255,198,92,.12);border:1px dashed var(--gold);color:var(--gold)}
  .day.rej{background:rgba(255,90,90,.10);border:1px solid #6e3636;color:#ff9b9b}
  .day.today{outline:2px solid var(--tq);outline-offset:1px}
  .day.future{opacity:.3}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .lg-acc{background:var(--tq)}.lg-pend{background:var(--gold)}.lg-rej{background:#ff7a7a}

  /* Списки участников/команд */
  /* ---- Лидерборд: SVG-иконки, подиум лиг, шкалы очков ---------------- */
  .ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;color:var(--tq)}
  .sec-title.warm .ic{color:var(--gold)}
  .sec-title.vi .ic{color:var(--vi)}
  .lsub{font-size:11.5px;color:var(--muted);margin:3px 0 2px;line-height:1.4}

  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:14px;
    border-bottom:1px solid rgba(255,255,255,.1)}
  .pod{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .pod.p1{flex:1.22 1 0}
  .pod .crown{width:22px;height:22px;color:var(--gold);margin-bottom:-3px}
  .pod .av{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;
    font-weight:800;font-size:15px;color:#14121b;background:var(--grad);
    box-shadow:0 8px 20px rgba(0,209,210,.22)}
  .pod.p1 .av{width:60px;height:60px;border-radius:21px;font-size:17px;
    background:var(--grad-warm);box-shadow:0 10px 26px rgba(255,198,92,.3)}
  .pod .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.3;width:100%;
    padding:0 2px;
    min-height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical}
  .pod .pt{font-size:13px;font-weight:900;color:var(--tq)}
  .pod.p1 .pt{color:var(--gold)}
  .pod .base{width:100%;height:54px;margin-top:2px;border-radius:14px 14px 0 0;
    border:1px solid rgba(255,255,255,.09);border-bottom:none;display:grid;place-items:center;
    font-size:15px;font-weight:900;color:var(--muted);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.01));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .pod.p1 .base{height:78px;color:var(--gold);border-color:rgba(255,198,92,.38);
    background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02));
    box-shadow:inset 0 1px 0 rgba(255,198,92,.45)}
  .pod.p3 .base{height:42px}

  .brow{padding:12px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:none}
  .bhead{display:flex;align-items:center;gap:11px}
  .bhead .nm{flex:1;font-weight:700;font-size:14px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bhead .pts{font-weight:900;font-size:14px;color:var(--tq)}
  .lbar{height:5px;border-radius:99px;background:rgba(255,255,255,.06);margin:9px 0 0 37px;
    overflow:hidden}
  .lbar i{display:block;height:100%;border-radius:99px;background:var(--grad);
    animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{width:0}}
  .lchip{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:800;background:var(--bg2);color:var(--muted);
    border:1px solid var(--line)}
  .lchip.c1{background:var(--grad-warm);color:#2a1e05;border-color:transparent}
  .lchip.c2{background:linear-gradient(135deg,#dfe5ee,#9aa4b2);color:#20242c;border-color:transparent}
  .lchip.c3{background:linear-gradient(135deg,#e3a877,#b9764a);color:#2a1b10;border-color:transparent}

  /* SVG вместо эмодзи в аккордеонах, плитках и календаре */
  .acc-ic .ic{width:19px;height:19px;color:var(--tq)}
  details.acc[open] .acc-ic .ic{color:#0d1117}
  .tile .ti{display:flex;justify-content:center;margin-bottom:6px}
  .tile .ti .ic{width:17px;height:17px;color:var(--muted)}
  .tile.acc-tile .ti .ic{color:var(--tq)}
  .day small .ic{width:11px;height:11px;stroke-width:2.4}
  .legend .ic{width:12px;height:12px;vertical-align:-2px;margin-left:3px}
  .note .ic{width:16px;height:16px;color:var(--gold);vertical-align:-3px;margin-right:4px}
  .stepy .av .ic{width:22px;height:22px;color:var(--tq)}
  .lockmsg .lk .ic{width:52px;height:52px;color:var(--tq);stroke-width:1.4}
  .gift-ic{width:78px;height:78px;color:var(--gold);stroke-width:1.2;
    filter:drop-shadow(0 10px 26px rgba(255,198,92,.35));position:relative;z-index:1}
  .myst .mrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
  .myst .lchip{width:22px;height:22px;border-radius:7px;font-size:11px}
  .btn-grad .ic,.btn-ghost .ic{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .sec-title .ic{width:19px;height:19px}

  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .rk{width:28px;height:28px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;
    font-weight:800;font-size:13px;flex:0 0 auto}
  .rk.g1{background:var(--grad-warm);color:#3a2410}.rk.g2{background:#3a3646;color:#cfc9dd}
  .rk.g3{background:#33303c;color:#b89b7a}
  .item .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .pts{font-weight:800;color:var(--tq)}
  .item.me{background:rgba(0,209,210,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}

  .rankbig{display:flex;align-items:baseline;gap:8px;justify-content:center}
  .rankbig b{font-size:40px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Правила */
  .rule{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .rule:last-child{border-bottom:none}
  .rnum{flex:0 0 26px;height:26px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--tq)}
  .rule p{margin:2px 0 0;font-size:14px;line-height:1.4}
  .scoregrid{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin-top:10px}
  .scoregrid .k{color:var(--muted)}.scoregrid .v{font-weight:800;text-align:right}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
    font-size:12px;font-weight:700;
    background:var(--grad);color:#06222b;margin-bottom:4px}
  a.link{color:var(--tq);text-decoration:none}

  /* Реплика Stepy — цитата с левой полосой и аватаром */
  .stepy{display:flex;gap:10px;background:rgba(0,209,210,.07);border:1px solid rgba(0,209,210,.25);
    border-left:3px solid var(--tq);border-radius:0 14px 14px 0;padding:12px 14px;margin:12px 0}
  .stepy .av{font-size:26px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
  .stepy .tx{font-size:13.5px;line-height:1.5}
  .stepy .tx b{color:var(--tq)}
  .howto{counter-reset:st;display:grid;gap:10px;margin-top:8px}

  /* ===== Производительность: без фризов на слабых Android =====
     Ауры были двумя анимированными кругами 70vmax с blur(80px) — GPU
     пересчитывал их каждый кадр, а заодно и backdrop-blur всех карточек над
     ними. Теперь — статичные радиальные градиенты, вид тот же. */
  .aur{filter:none;animation:none;opacity:.16;contain:strict}
  .aur.a1{background:radial-gradient(closest-side,#10B981 35%,transparent);animation:none}
  .aur.a2{background:radial-gradient(closest-side,#6366F1 35%,transparent);animation:none}
  /* Стекло у прокручиваемых карточек: под ними почти однотонный фон, blur
     визуально ничего не даёт, но перерисовывается на каждом кадре скролла.
     Оставлен только у фиксированных элементов (навигация, кнопки шапки). */
  .card,.acc,.lbx-row,.stage,.lbx-list,.tm-card,.pg-hero,.pg-card,.pg-tile,.pg-today,.pz-hero4,.pz-card4{
    -webkit-backdrop-filter:none;backdrop-filter:none}

  @keyframes ringPulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.25);opacity:0}}
  .c1 .lbx-av::after{box-shadow:0 0 18px rgba(245,158,11,.8)}

  .paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}

<!-- Спрайт иконок лидерборда: рисуем линиями в цвет темы, а не эмодзи —
     так они одинаково выглядят на iOS и Android и тянутся с палитрой. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00d1d2"/><stop offset="100%" stop-color="#7a5cff"/>
  </linearGradient>
  <linearGradient id="g-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d1d2"/><stop offset="100%" stop-color="#7a5cff"/>
  </linearGradient>

<script>
const tg = window.Telegram?.WebApp;
try{
  tg?.ready(); tg?.expand();
  tg?.setHeaderColor?.("#0B0F17"); tg?.setBackgroundColor?.("#0B0F17");
  tg?.disableVerticalSwipes?.();
}catch(e){}
// initData читаем «лениво» при каждом запросе из нескольких источников:
//  1) SDK (window.Telegram.WebApp.initData) — основной путь;
//  2) URL-хэш #tgWebAppData=... — Telegram кладёт туда данные при запуске web_app.
//     На Telegram Desktop .initData иногда пустой, а в хэше данные есть;
//  3) query ?tgWebAppData=... — на всякий случай.
function getInit(){
  try{ const d=window.Telegram?.WebApp?.initData; if(d) return d; }catch(e){}
  try{ const raw=new URLSearchParams(location.hash.slice(1)).get("tgWebAppData"); if(raw) return raw; }catch(e){}
  try{ const raw=new URLSearchParams(location.search).get("tgWebAppData"); if(raw) return raw; }catch(e){}
  return "";
}
const BUILD="phone-login";
const BOTLINK="https://t.me/wegrowmarathon_bot";
// Сессия по номеру телефона (localStorage): выдаётся сервером после проверки в базе.
function session(){ try{ return localStorage.getItem("st_session")||""; }catch(e){ return ""; } }
function setSession(t){ try{ localStorage.setItem("st_session",t); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem("st_session"); }catch(e){} }
function openBot(){ try{ tg?.openTelegramLink?.(BOTLINK); }catch(e){ location.href=BOTLINK; } }
// «Сдать» → бот + сразу запуск сдачи шагов. Deep link ?start=steps: бот ловит
// payload и открывает тот же шаг, что кнопка «Шаги за сегодня». Мини-апп
// закрываем сами — открытие ссылки на ТОТ ЖЕ чат клиент иначе игнорирует, и
// визуально «ничего не происходит».
function openSteps(){
  const url=BOTLINK+"?start=steps";
  try{ tg?.HapticFeedback?.impactOccurred?.("light"); }catch(e){}
  try{ tg?.openTelegramLink?.(url); }catch(e){}
  if(!tg?.openTelegramLink){ location.href=url; return; }
  setTimeout(()=>{ try{ tg?.close?.(); }catch(e){} },150);
}
// Ждём до ~3с, пока initData появится (первый запуск), затем стартуем.
async function waitInit(ms=3000){
  const step=100; let waited=0;
  while(!getInit() && waited<ms){ await new Promise(r=>setTimeout(r,step)); waited+=step; }
  return getInit();
}
const haptic = (t="light")=>{ try{ tg?.HapticFeedback?.impactOccurred(t); }catch(e){} };
const hsel = ()=>{ try{ tg?.HapticFeedback?.selectionChanged(); }catch(e){} };
const himp = ()=>{ try{ tg?.HapticFeedback?.impactOccurred('light'); }catch(e){} };
const hok = ()=>{ try{ tg?.HapticFeedback?.notificationOccurred('success'); }catch(e){} };

const FIT_A="https://play.google.com/store/apps/details?id=com.fitbit.FitbitMobile";
const FIT_I="https://apps.apple.com/us/app/fitbit-health-fitness/id462638897";
const FEEDBACK="https://t.me/aidanazhanyshbekova";
function openPC(){ try{ tg?.openTelegramLink?.(FEEDBACK); }catch(e){ location.href=FEEDBACK; } }
function openExt(u){ try{ if(tg?.openLink){ tg.openLink(u); return false; } }catch(e){} window.open(u,"_blank"); return false; }

// Замеры открытия (мс от старта страницы) — уходят на сервер, медленные
// открытия видны в логах Render: так понятно, где теряется время.
const T0=performance.now(); const MARKS={};
function mark(k){ if(!(k in MARKS)) MARKS[k]=Math.round(performance.now()-T0); }
function sendTiming(){
  try{
    mark("shown");
    const body=JSON.stringify({m:MARKS, p:tg?.platform||"web", v:tg?.version||""});
    if(navigator.sendBeacon) navigator.sendBeacon("/api/timing", new Blob([body],{type:"application/json"}));
    else fetch("/api/timing",{method:"POST",headers:{"Content-Type":"application/json"},body});
  }catch(e){}
}
function hint(t){ const h=document.getElementById("load-hint"); if(h) h.textContent=t; }

// fetch с таймаутом: на мобильной сети запрос мог «повиснуть» и спиннер
// крутился бесконечно. Через 8 с прерываем и повторяем один раз.
async function fetchT(path, opts={}, ms=8000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), ms);
  try{ return await fetch(path,{...opts, signal:ctl.signal}); } finally{ clearTimeout(t); }
}
async function api(path){
  const opts={headers:{"X-Init-Data": getInit(), "X-Session": session()}};
  const slow=setTimeout(()=>hint("Подключаемся к серверу…"), 1500);
  mark("api_start");
  let r;
  try{ r=await fetchT(path, opts); }
  catch(e){ hint("Сеть медленная — пробуем ещё раз…"); mark("retry"); r=await fetchT(path, opts, 15000); }
  finally{ clearTimeout(slow); }
  mark("api_done");
  if(r.status===401){ clearSession(); meCacheClear(); renderLogin(); throw new Error("HTTP 401"); }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail||""; }catch(_){}
    throw new Error("HTTP "+r.status+(d?": "+d:"")); }
  return r.json();
}
async function postLogin(phone){
  const r = await fetch("/api/login",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({phone})});
  return r.json();
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const V=document.getElementById("view");
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function fmtDM(iso){ const p=String(iso).split("-"); return p[2]+"."+p[1]; }
function fmtFull(iso){ const [y,m,dd]=String(iso).split("-"); return parseInt(dd,10)+" "+MONTHS[parseInt(m,10)-1]+" "+y; }

// Баллы: целые как есть, средний балл команды — с одной цифрой после запятой.
const fmtPts=(x)=>{ const n=Number(x)||0; return Number.isInteger(n)?String(n):n.toFixed(1).replace(".",","); };
function countUp(el,to,dur=900,fmt){
  const start=performance.now(), from=0;
  (function tick(t){
    // rAF-время кадра может быть чуть раньше start → без max(0) мелькало отрицательное число
    const p=Math.min(1,Math.max(0,(t-start)/dur)), e=1-Math.pow(1-p,3);
    const raw=from+(to-from)*e, v=Number.isInteger(to)?Math.round(raw):Math.round(raw*10)/10;
    el.textContent=fmt?fmt(v):v;
    if(p<1)requestAnimationFrame(tick);
  })(start);
}

const STAGES=[{e:"🌱",n:"Семечко"},{e:"🌿",n:"Росток"},{e:"🪴",n:"Кустик"},{e:"🌳",n:"Дерево"},{e:"🌸",n:"Цветение"}];
function stageIndex(p,streak){ if(streak>=7||p>=50)return 4; if(p>=30)return 3; if(p>=15)return 2; if(p>=5)return 1; return 0; }
function pcls(p){ return p>=3?"p3":p>=2?"p2":p>=1?"p1":""; }
function rk(i){ return `<div class="rk ${i===0?'g1':i===1?'g2':i===2?'g3':''}">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>`; }

let renderGen=0;

// День недели по ISO-дате (0=Пн … 6=Вс) через конгруэнцию Целлера.
// Именно так, а не через new Date(): у участника западнее Бишкека
// разбор даты браузером сдвинул бы календарь на день.
function isoDow(iso){
  let [y,m,d]=String(iso).split("-").map(Number);
  if(m<3){ m+=12; y-=1; }
  const K=y%100, J=Math.floor(y/100);
  const h=(d+Math.floor(13*(m+1)/5)+K+Math.floor(K/4)+Math.floor(J/4)+5*J)%7;
  return (h+5)%7;
}
const nfmt=(n)=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
// Шаги коротко для ячеек календаря: 9 500 → 9,5K, 12 340 → 12K, 125 000 → 125K.
const stepsK=(n)=>{ n=Number(n)||0; return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(".",",")+"K":String(n); };

// Полоса «сегодня»: статус дня + понятное следующее действие.
function todayStrip(d){
  const t=d.calendar.find(c=>c.is_today);
  if(d.aggregate){                      // админ: сводка дня по всем участникам
    if(!t) return "";
    const n=d.participants||0, a=t.accepted||0, p=t.pending||0;
    return `<div class="tdy ${p?"wait":a?"ok":"none"}"><div class="tic">${ico(p?"hourglass":"check")}</div>
      <div class="tt"><b>Сегодня: принято ${a} из ${n}</b><span>${p?`на проверке ${p} · `:""}${nfmt(t.steps||0)} шагов · +${t.points||0} б.</span></div></div>`;
  }
  const st=d.today_status;
  if(st==="accepted") return `<div class="tdy ok"><div class="tic">${ico("check")}</div>
    <div class="tt"><b>Сегодня засчитано</b><span>${nfmt(t?.steps||0)} шагов · +${t?.points||0} балл(а)</span></div></div>`;
  if(st==="pending") return `<div class="tdy wait"><div class="tic">${ico("hourglass")}</div>
    <div class="tt"><b>Результат на проверке</b><span>${nfmt(t?.steps||0)} шагов ждут подтверждения P&amp;C</span></div></div>`;
  if(st==="rejected") return `<div class="tdy bad"><div class="tic">${ico("cross")}</div>
    <div class="tt"><b>Результат отклонён</b><span>Проверь скриншот и пришли заново</span></div>
    <button class="go" onclick="openSteps()">Сдать</button></div>`;
  if(!t) return "";                     // марафон ещё не идёт
  return `<div class="tdy none"><div class="tic">${ico("steps")}</div>
    <div class="tt"><b>Сегодня ещё не сдан</b><span>Пришли число шагов и скриншот до 23:55</span></div>
    <button class="go" onclick="openSteps()">Сдать</button></div>`;
}

// Спарклайн шагов по дням марафона: плавная линия + заливка под ней.
function spark(vals){
  const W=300,H=74,P=6;
  if(vals.length<2) return "";
  const max=Math.max(...vals,1), min=Math.min(...vals);
  const lo=Math.max(0,min-(max-min||max)*0.6), rng=(max-lo)||1;   // без вырождения в полосу
  const pt=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),
                            H-P-((v-lo)/rng)*(H-2*P-10)]);
  // сглаживаем кубическими кривыми по средним точкам — линия без изломов
  let dpath=`M${pt[0][0].toFixed(1)},${pt[0][1].toFixed(1)}`;
  for(let i=1;i<pt.length;i++){
    const [x0,y0]=pt[i-1],[x1,y1]=pt[i],mx=(x0+x1)/2;
    dpath+=` C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const last=pt[pt.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${dpath} L${W-P},${H} L${P},${H} Z" fill="url(#g-area)" stroke="none"/>
    <path d="${dpath}" fill="none" stroke="url(#g-line)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="#fff"/>
  </svg>`;
}

// Столбики последних 7 дней с подписью на лучшем дне.
// Сплайн общего прогресса: подписи первого/последнего дня, светящаяся точка.
function spark2(vals){
  if(vals.length<2) return `<div class="pg-spark-empty">график появится со второго дня</div>`;
  const W=320,H=86,P=8, max=Math.max(...vals,1);
  const pt=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1), H-10-(v/max)*(H-24)]);
  let p=`M${pt[0][0].toFixed(1)},${pt[0][1].toFixed(1)}`;
  for(let i=1;i<pt.length;i++){const [x0,y0]=pt[i-1],[x1,y1]=pt[i],m=(x0+x1)/2;
    p+=` C${m.toFixed(1)},${y0.toFixed(1)} ${m.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;}
  const [lx,ly]=pt[pt.length-1];
  return `<svg class="pg-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="pgArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".35"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient>
      <linearGradient id="pgLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
    <path d="${p} L${lx.toFixed(1)},${H} L${P},${H} Z" fill="url(#pgArea)"/>
    <path d="${p}" fill="none" stroke="url(#pgLine)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="#06B6D4" opacity=".25"><animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="#fff"/>
  </svg>`;
}
// Текущая календарная неделя пн–вс (по серверным датам).
function curWeek(cal){
  const ti=cal.findIndex(c=>c.is_today);
  const last=ti>=0?ti:(cal.every(c=>c.future)?0:cal.filter(c=>!c.future).length-1);
  const start=last-isoDow(cal[last].date);
  return Array.from({length:7},(_,k)=>cal[start+k]||null);
}
const weekSum=cal=>cal.length?curWeek(cal).reduce((s,c)=>s+(c?.steps||0),0):0;
function week7b(cal){
  if(!cal.length) return "";
  const days=curWeek(cal), WD=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
  const max=Math.max(...days.map(c=>c?.steps||0),1);
  let hi=days.findIndex(c=>c?.is_today);
  if(hi<0||!(days[hi]?.steps)) hi=days.reduce((b,c,i)=>((c?.steps||0)>(days[b]?.steps||0)?i:b),0);
  return `<div class="wk">${days.map((c,i)=>{const v=c?.steps||0,h=v?Math.max(8,Math.round(v/max*100)):4;
    return `<div class="wk-col ${i===hi&&v?"hi":""} ${c?.is_today?"now":""}">
      ${i===hi&&v?`<span class="wk-tip">${nfmt(v)}</span>`:""}
      <div class="wk-track"><i style="height:${h}%"></i></div><span class="wk-d">${WD[i]}</span></div>`;}).join("")}</div>`;
}
function week7(cal){
  const days=cal.filter(c=>!c.future).slice(-7);
  if(!days.length) return "";
  const WD=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
  const max=Math.max(...days.map(c=>c.steps||0),1);
  const bi=days.reduce((b,c,i)=>((c.steps||0)>(days[b].steps||0)?i:b),0);
  const bars=days.map((c,i)=>{
    const h=Math.round(((c.steps||0)/max)*88);
    return `<div class="bar7 ${c.steps?"":"zero"} ${i===bi&&c.steps?"max":""}">
      <i style="height:${Math.max(5,h)}px"></i><span>${WD[isoDow(c.date)]}</span></div>`;
  }).join("");
  const best=days[bi].steps||0;
  const tip=best?`<div class="btip" style="left:${((bi+0.5)/days.length*100).toFixed(1)}%;top:6px">
      ${nfmt(best)}</div>`:"";
  return `<div class="barsw">${tip}<div class="bars">${bars}</div></div>`;
}

// Кэш последнего /api/me: экран «Прогресс» рисуется мгновенно из кэша,
// а свежие данные с сервера (бот в Oregon, участники в Бишкеке) тихо
// подменяют его — так первый экран не ждёт сети.
const ME_KEY=()=>"st_me_"+(tg?.initDataUnsafe?.user?.id||"s");
function meCacheGet(){ try{ const v=localStorage.getItem(ME_KEY()); return v?JSON.parse(v):null; }catch(e){ return null; } }
function meCacheSet(d){ try{ localStorage.setItem(ME_KEY(), JSON.stringify(d)); }catch(e){} }
function meCacheClear(){ try{ localStorage.removeItem(ME_KEY()); localStorage.removeItem(CK("team")); localStorage.removeItem(CK("board")); }catch(e){} }

// Кэш вкладок «Команда» и «Лидеры» (как у «Прогресса»): вкладка рисуется
// мгновенно из кэша, свежие данные подменяют её, только если изменились.
// Раньше каждое нажатие ждало сеть, и экран «замирал» на старой вкладке.
const CK=k=>"st_"+k+"_"+(tg?.initDataUnsafe?.user?.id||"s");
const MEM={};
function cacheGet(k){ if(MEM[k]) return MEM[k]; try{ const v=localStorage.getItem(k); return v?(MEM[k]=JSON.parse(v)):null; }catch(e){ return null; } }
function cacheSet(k,d){ MEM[k]=d; try{ localStorage.setItem(k, JSON.stringify(d)); }catch(e){} }
async function cachedView(key, path, draw){
  const my=++renderGen, k=CK(key), cached=cacheGet(k);
  if(cached) draw(cached);
  else V.innerHTML=`<div class="spin"></div>`;
  let d; try{ d=await api(path); }catch(e){ if(my===renderGen && !cached)notice(e); return; }
  if(my!==renderGen) return;
  const same=cached && JSON.stringify(cached)===JSON.stringify(d);
  cacheSet(k,d);
  if(!same) draw(d);
}
// После первого экрана тихо подгружаем остальные вкладки — переход мгновенный.
function prefetchTabs(){
  const go=()=>[["team","/api/team"],["board","/api/leaderboard"]].forEach(([k,path])=>{
    fetchT(path,{headers:{"X-Init-Data":getInit(),"X-Session":session()}},15000)
      .then(r=>r.ok?r.json():null).then(d=>{ if(d) cacheSet(CK(k),d); }).catch(()=>{});
  });
  (window.requestIdleCallback||((f)=>setTimeout(f,600)))(go);
}

async function renderProgress(){
  const my=++renderGen;
  const cached=meCacheGet();
  if(cached){ drawProgress(cached); mark("cache"); }
  let d; try{ d=await api("/api/me"); }catch(e){ if(my===renderGen && !cached)notice(e); return; }
  if(my!==renderGen) return;
  const same=cached && JSON.stringify(cached)===JSON.stringify(d);
  meCacheSet(d);
  if(!same) drawProgress(d);     // ничего не изменилось — не перерисовываем
  if(!window.__timingSent){ window.__timingSent=1; sendTiming(); }
  if(!window.__prefetched && (d.registered||d.admin)){ window.__prefetched=1; prefetchTabs(); }
}

// Шапка-баннер: имя, стрик, команда (из /api/me; без эмодзи команд).
function fillHead(d){
  const $=id=>document.getElementById(id);
  const name=(d.full_name||"").trim();
  $("hb-name").textContent=name||"Марафон шагов";
  $("hb-av").textContent=((d.team_name||name||"S").trim()[0]||"S").toUpperCase();
  const n=Number(d.current_streak)||0, st=$("hb-streak");
  st.hidden=!n; if(n) st.innerHTML=`${ico("l-flame")}${n} ${plural(n,"день","дня","дней")} подряд`;
  $("head-sub").textContent=d.team_name?`Команда «${d.team_name}» • Марафон шагов`:"Командный зачёт • Марафон шагов";
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;}
const FLAME=`<svg class="fl-ic" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="flG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#EA580C"/><stop offset=".6" stop-color="#FB923C"/><stop offset="1" stop-color="#FDE68A"/></linearGradient></defs><path fill="url(#flG)" d="M12 2c.6 3.2 3 4.9 4.6 7 1.4 1.8 2.4 3.6 2.4 5.9A7 7 0 0 1 5 14.9c0-2.3 1-4.2 2.6-5.6-.1 1.6.4 3 1.6 3.9C9 9 10.4 5.3 12 2z"/><path fill="#FFF7D6" opacity=".9" d="M12 12.5c1.6 1.4 2.8 2.6 2.8 4.3a2.8 2.8 0 0 1-5.6 0c0-1.5.9-2.6 2.8-4.3z"/></svg>`;
function drawProgress(d){
  setAdminBtn(!!d.admin);
  if(!d.registered) return d.admin?adminHome(d):regNotice();
  fillHead(d);
  const A=!!d.aggregate;   // админ: суммы по всем участникам
  if(A){ const $=id=>document.getElementById(id);
    $("hb-name").textContent="Администратор"; $("hb-av").textContent="A"; $("hb-streak").hidden=true;
    $("head-sub").textContent=`Режим P&C • ${d.participants||0} участников`; }

  const si=stageIndex(d.total_points,d.best_streak), st=STAGES[si];
  const nextAt=[5,15,30,50,9999][si];
  const stagePct=Math.min(100,Math.round(d.total_points/nextAt*100));
  const R=33, C=2*Math.PI*R;

  const acc=d.calendar.filter(c=>c.status==="accepted");
  const steps=acc.reduce((s,c)=>s+(c.steps||0),0);
  const done=d.calendar.filter(c=>c.status).length;
  const missed=d.calendar.filter(c=>!c.status&&!c.future&&!c.is_today).length;
  const left=d.calendar.filter(c=>c.future).length;
  const streak=d.current_streak||0;
  const goalLeft=streak>=7?0:(streak>=5?7-streak:5-streak);
  const streakPct=Math.min(100,Math.round(streak/7*100));

  const h=d.hour??12;
  const hello=h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";
  const first=(d.full_name||"").split(/\s+/)[1]||(d.full_name||"").split(/\s+/)[0]||"друг";

  // Календарь по неделям: первый день марафона сдвигаем на его столбец.
  // Именно смещением, а не пустыми ячейками: пустые div в одной сетке с
  // aspect-ratio-ячейками ломают расчёт строк, и колонки разъезжаются.
  const shift=isoDow(d.calendar[0]?.date||d.marathon.start)+1;
  const cal=d.calendar.map((c,idx)=>{
    let base="", badge="";
    // В ячейке — шаги (коротко: 12,3K); баллы — во всплывающей подсказке.
    if(c.status==="accepted"){ base=pcls(c.points)||"p0"; badge=c.steps?`<small>${stepsK(c.steps)}</small>`:""; }
    else if(c.status==="pending"){ base="pend"; badge=`<small>${c.steps?stepsK(c.steps):ico("hourglass")}</small>`; }
    else if(c.status==="rejected"){ base="rej"; badge=`<small>${ico("cross")}</small>`; }
    else if(c.future){ base="empty"; }
    else if(!c.is_today){ base="miss"; }
    else base="empty";
    const cls=["day",base,c.is_today?"today":"",c.future?"future":""].join(" ");
    const stl=idx===0&&shift>1?` style="grid-column-start:${shift}"`:"";
    const tip=c.status?` title="${nfmt(c.steps||0)} шагов${c.status==="accepted"?" · "+fmtPts(c.points)+" б.":""}"`:"";
    return `<div class="${cls}"${stl}${tip}><b>${parseInt(c.date.slice(8),10)}</b>${badge}</div>`;
  }).join("");

  const ring=(id,pct,inner,cls="")=>`<div class="mring ${cls}">
      <svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="${R}"/>
        <circle class="fg" id="${id}" cx="40" cy="40" r="${R}"
                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg>
      <div class="em">${inner}</div></div>`;

  const tday=d.calendar.find(c=>c.is_today);
  const todayDone=A?(tday?.accepted||0)+(tday?.pending||0):(d.today_status?1:0);
  const todayTotal=A?(d.participants||0):1;
  const todayTxt=A?`Сегодня сдано: <b>${todayDone} / ${todayTotal}</b>`
    :d.today_status==="accepted"?`Сегодня засчитано: <b>${nfmt(tday?.steps||0)}</b> шагов`
    :d.today_status==="pending"?`Сегодня: <b>${nfmt(tday?.steps||0)}</b> шагов на проверке`
    :d.today_status==="rejected"?`Сегодня: результат <b>отклонён</b> — пришли заново`
    :`Сегодня ещё не сдано — до <b>23:55</b>`;
  const todaySub=A?(tday?`принято ${tday.accepted||0}${tday.pending?` · на проверке ${tday.pending}`:""}`:"марафон ещё не идёт")
    :(tday?.points?`+${tday.points} б. за день`:"число шагов + скриншот в боте");
  const todayState=A?(todayDone>=todayTotal&&todayTotal?"ok":"warn")
    :d.today_status==="accepted"?"ok":d.today_status==="pending"?"wait":"warn";
  const card2=A
    ? (d.leader?`<div class="pg-tile" onclick="show('board')">
        <div class="pg-lbl">Лидер</div>
        <div class="pg-team"><span class="pg-cup">${ico("l-trophy")}</span><span>${esc(d.leader.name)}</span></div>
        <div class="pg-big au">${fmtPts(d.leader.points)}<small>ср. балл</small></div></div>`
      :`<div class="pg-tile" onclick="show('board')"><div class="pg-lbl">Лидер</div>
        <div class="pg-team"><span class="pg-cup">${ico("l-trophy")}</span><span>пока нет</span></div>
        <div class="pg-sub">появится после первых баллов</div></div>`)
    : `<div class="pg-tile" onclick="show('board')">
        <div class="pg-lbl">Место команды</div>
        <div class="pg-team"><span class="pg-cup">${ico("l-trophy")}</span><span>${esc(d.team_name||"")}</span></div>
        <div class="pg-big au">${d.team_rank?"#"+d.team_rank:"—"}<small>${d.teams_total?`из ${d.teams_total}`:""}</small></div></div>`;
  const body=`
    <section class="pg-hero">
      <div class="pg-kick">${A?"Общий прогресс":"Мой прогресс"}</div>
      <div class="pg-main"><span class="pg-num" id="s-steps">0</span>
        <span class="pg-chip">+${fmtPts(d.total_points)} ${plural(Math.round(d.total_points),"балл","балла","баллов")}</span></div>
      <div class="pg-cap">${A?`${d.participants||0} ${plural(d.participants||0,"участник","участника","участников")} в строю`
        :`${hello}, ${esc(first)} · ${st.e} ${st.n}`}</div>
      ${spark2(d.calendar.filter(c=>!c.future).map(c=>c.steps||0))}
    </section>

    <div class="pg-today ${todayState}" ${!A&&d.today_status!=="accepted"&&d.today_status!=="pending"?`onclick="openSteps()"`:""}>
      <span class="pg-dot"></span>
      <div class="pg-tt"><div>${todayTxt}</div><span>${todaySub}</span></div>
      ${!A&&d.today_status!=="accepted"&&d.today_status!=="pending"&&tday?`<span class="pg-go">Сдать</span>`:""}
    </div>

    <div class="pg-grid">
      <div class="pg-tile">
        <div class="pg-lbl">${A?"Лучшая серия":"Серия"}</div>
        <div class="pg-ring">${ring("ring-streak",streakPct,FLAME)}
          <div class="pg-big">${streak}<small>${plural(streak,"день","дня","дней")}</small></div></div>
        <div class="pg-sub">${A?"у самого стабильного":streak>=7?"бонус недели взят":`до +${streak>=5?4:2} б. — ещё ${goalLeft} дн.`}</div>
      </div>
      ${card2}
    </div>

    <section class="pg-card">
      <div class="pg-head"><span>Активность недели</span><b>${nfmt(weekSum(d.calendar))}</b></div>
      ${week7b(d.calendar)}
    </section>

    <section class="pg-card">
      <div class="pg-head"><span>Календарь марафона</span><em>${fmtDM(d.marathon.start)}–${fmtDM(d.marathon.end)}</em></div>
      <div class="cal-wd"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div></div>
      <div class="cal">${cal}</div>
      <div class="legend">
        <span><i class="lg-acc"></i>принято</span><span><i class="lg-pend"></i>на проверке</span><span><i class="lg-rej"></i>отклонено</span>
        ${!A&&missed?`<span>пропущено ${missed}</span>`:""}
      </div>
    </section>`;

  // До старта марафона «Прогресс» заблюрен + дисклеймер. Считаем по
  // СЕРВЕРНЫМ флагам future (таймзона Бишкека), а не по часам клиента.
  const notStarted=d.calendar.length>0&&d.calendar.every(c=>c.future);
  const inner=notStarted
    ? `<div class="locked"><div class="blurwrap">${body}</div>
         <div class="lockmsg">
           <div class="lk">${ico("lock")}</div>
           <div class="lt">Марафон ещё не начался</div>
           <div class="ls">Твой прогресс, растение и календарь откроются со старта.<br>
             Начало — <b>${fmtFull(d.marathon.start)}</b> 🌱</div>
           <div class="chip">Старт ${fmtDM(d.marathon.start)}</div>
         </div></div>`
    : body;
  const reg=A?`<div class="card" style="text-align:center">
      <p class="muted" style="margin:0 0 12px">Хочешь сам шагать в марафоне? Регистрация — как у всех участников, в боте.</p>
      <button class="btn-grad" onclick="openRegister()">${ico("l-foot")}Зарегистрироваться как участник</button></div>`:"";
  V.innerHTML=`<div class="view">${inner}${reg}</div>`;
  requestAnimationFrame(()=>{
    const set=(id,pct)=>{const r=document.getElementById(id);
      if(r)r.style.strokeDashoffset=(C*(1-pct/100)).toFixed(1);};
    set("ring-stage",stagePct); set("ring-streak",streakPct);
    const sw=document.getElementById("s-steps"); if(sw)countUp(sw,steps,1100,nfmt);
  });
}

}

// Подиум: 2-е место слева, 1-е по центру и выше, 3-е справа.
function podium(list){
  const l=list||[];
  if(!l.length) return emptyRow();
  return `<div class="podium">`+[1,0,2].filter(i=>l[i]).map(i=>{
    const p=l[i];
    return `<div class="pod p${i+1}">`+
      (i===0?`<svg class="ic crown"><use href="#i-crown"/></svg>`:"")+
      `<div class="av">${esc(initials(p.name))}</div>
       <div class="nm">${esc(shortName(p.name))}</div>
       <div class="pt">${fmtPts(p.points)}</div>
       <div class="base">${i+1}</div></div>`;
  }).join("")+`</div>`;
}

// Строки со шкалой: длина полосы — доля от результата лидера.
function bars(list,people){
  const l=list||[];
  if(!l.length) return emptyRow();
  const max=Math.max(...l.map(x=>x.points),1);
  return l.map((x,i)=>`<div class="brow">
    <div class="bhead"><div class="lchip ${i<3?"c"+(i+1):""}">${i+1}</div>
      <div class="nm">${esc(people?shortName(x.name):(x.name||"—"))}</div>
      <div class="pts">${fmtPts(x.points)}</div></div>
    <div class="lbar"><i style="width:${Math.max(x.points>0?6:0,Math.round(x.points/max*100))}%"></i></div>
  </div>`).join("");
}

function drawBoard(d){

  if(!teams.length){ V.innerHTML=`<div class="view">${emptyRow()}</div>`; return; }

  const allZero=teams.every(t=>!Number(t.points));

  const pod=[1,0,2].filter(k=>teams[k]).map(k=>{const t=teams[k];return `

  </div>`;
  lbCount(V.querySelectorAll(".lbx-num[data-n]"));
  V.querySelectorAll(".lbx-bar i").forEach(i=>{ const w=i.style.getPropertyValue("--w"); i.style.width="0";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ i.style.width=w; })); });
  V.querySelectorAll(".lbx-row").forEach(r=>r.addEventListener("click",himp));
}
// Плавное нарастание счётчика (ease-out), уважает prefers-reduced-motion.
function lbCount(els,ms=900){
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  els.forEach(el=>{ const to=Number(el.dataset.n)||0;
    if(still||!to){ el.textContent=fmtPts(to); return; }
    const t0=performance.now();
    const step=now=>{ const p=Math.min(1,Math.max(0,(now-t0)/ms)), e=1-Math.pow(1-p,3);
      el.textContent=fmtPts(p<1?Math.round(to*e*10)/10:to); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
}

function fmtLeft(ms){
  if(ms<=0) return null;
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4), se=Math.floor(ms%6e4/1e3);
  const p=n=>String(n).padStart(2,"0");
  return {d,h:p(h),m:p(mi),s:p(se)};
}

// 3D-наклон hero: палец/мышь по карточке; на телефоне — гироскоп Telegram
// (WebApp.DeviceOrientation, Bot API 8.0+). Выключается при уходе с вкладки.
const TILT_MAX=8;
function stopTilt(){ try{ tiltOff?.(); }catch(e){} tiltOff=null; }
function startTilt(){
  stopTilt();
  const el=document.getElementById("pz3-hero");
  if(!el||REDUCED()) return;
  const set=(rx,ry,live)=>{ el.classList.toggle("live",!!live);
    el.style.setProperty("--rx",rx.toFixed(2)+"deg"); el.style.setProperty("--ry",ry.toFixed(2)+"deg");
    el.style.setProperty("--gx",(50+ry*4).toFixed(1)+"%"); };
  const clamp=v=>Math.max(-TILT_MAX,Math.min(TILT_MAX,v));
  const move=e=>{ const r=el.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    set(clamp(-y*2*TILT_MAX),clamp(x*2*TILT_MAX),true); };
  const leave=()=>set(0,0,false);
  el.addEventListener("pointermove",move); el.addEventListener("pointerleave",leave); el.addEventListener("pointerup",leave);
  let gyro=null, base=null;
  try{
    const DO=tg?.DeviceOrientation;
    if(DO && tg.isVersionAtLeast?.("8.0")){
      gyro=()=>{ if(DO.beta==null) return; if(!base) base={b:DO.beta,g:DO.gamma};
        const k=180/Math.PI; set(clamp(-(DO.beta-base.b)*k*.35),clamp((DO.gamma-base.g)*k*.35),true); };
      tg.onEvent("deviceOrientationChanged",gyro); DO.start({refresh_rate:60});
    }
  }catch(e){ gyro=null; }
  tiltOff=()=>{ el.removeEventListener("pointermove",move); el.removeEventListener("pointerleave",leave); el.removeEventListener("pointerup",leave);
    if(gyro){ try{ tg.offEvent("deviceOrientationChanged",gyro); tg.DeviceOrientation.stop(); }catch(e){} } };
}

    <div class="card">
      <div class="at-head"><div class="hb-av">${esc(((p.team||p.name||"?").trim()[0]||"?").toUpperCase())}</div>

      <div style="margin:-4px 0 12px">${ST_CHIP[p.status]||""}</div>

      <div class="adm-sub" style="white-space:normal">${p.phone?`Телефон: <b style="color:#CBD5E1;-webkit-user-select:text;user-select:text">${esc(p.phone)}</b> · `:""}ID ${Number(p.tg_id)}</div>
    </div>

      <div class="cal-wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>

      <div class="adm-leg"><span><i style="background:#10B981"></i>принят ${cnt("accepted")}</span><span><i style="background:#F59E0B"></i>на проверке ${cnt("pending")}</span><span><i style="background:#EF4444"></i>отклонён ${cnt("rejected")}</span><span>✍ — внесено P&C · тап по дню — скриншот</span></div></div>

const emptyRow=()=>`<div class="muted" style="padding:8px 0">— пока пусто —</div>`;
function regNotice(){ V.innerHTML=`<div class="center">Ты ещё не в марафоне 🌱<br><br>Открой бота и нажми <b>/start</b>, чтобы зарегистрироваться.

// Экран входа по номеру телефона (когда нет Telegram-авторизации).
function renderLogin(){
  V.innerHTML=`<div class="view"><div class="card d1" style="text-align:center">
    <div class="plant" style="font-size:52px">🪴</div>
    <div class="stage">Вход в Step Together</div>
    <p class="muted" style="margin:10px auto 16px;max-width:340px;line-height:1.5">
      Введи номер телефона, который ты указал при регистрации в боте — проверим по базе и откроем доступ.</p>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67"
      style="width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
      background:var(--bg2);color:var(--text);font-size:16px;text-align:center;
      -webkit-user-select:text;user-select:text;outline:none">
    <div id="lmsg" style="min-height:20px;margin:10px 0;font-size:13px;color:var(--gold)"></div>
    <button class="btn-grad" onclick="doLogin()">Войти</button>
    <button class="btn-ghost" onclick="openBot()">Я ещё не регистрировался — открыть бота</button>
  </div></div>`;
  const inp=document.getElementById("phone");
  inp?.addEventListener("keydown",e=>{ if(e.key==="Enter")doLogin(); });
  setTimeout(()=>inp?.focus(),100);
}
async function doLogin(){
  const el=document.getElementById("phone"), msg=document.getElementById("lmsg");
  if(!el) return;
  const phone=el.value.trim();
  if(phone.replace(/\D/g,"").length<9){ msg.textContent="Введите корректный номер телефона"; return; }
  msg.style.color="var(--muted)"; msg.textContent="Проверяю…";
  let d; try{ d=await postLogin(phone); }catch(e){ msg.style.color="var(--gold)"; msg.textContent="Ошибка сети, попробуй ещё раз"; return; }
  if(d.ok){
    setSession(d.token);
    Object.keys(loaded).forEach(k=>delete loaded[k]); V.dataset.tab="";
    haptic("medium"); show("progress"); return;
  }
  msg.style.color="var(--gold)";
  if(d.registered===false){
    msg.innerHTML="Этот номер не найден в базе 🌱 Сначала пройди регистрацию в боте (кнопка ниже).";
  } else if(d.reason==="disqualified"){
    msg.textContent="Доступ закрыт: участник дисквалифицирован.";
  } else if(d.reason==="bad_phone"){
    msg.textContent="Введите корректный номер телефона";
  } else if(d.reason==="rate_limited"){
    msg.textContent="Слишком много попыток. Подожди 10 минут и попробуй снова.";
  } else {
    msg.textContent="Не удалось войти. Проверь номер и попробуй снова.";
  }
}
function diagText(){
  const w=window.Telegram?.WebApp;
  let uid="—"; try{ uid=w?.initDataUnsafe?.user?.id ?? "—"; }catch(e){}
  const parts=[
    "build: "+BUILD,

    "version: "+(w?.version||"—"),

    "hash.tgWebAppData: "+(new URLSearchParams(location.hash.slice(1)).get("tgWebAppData")?"есть":"нет"),

function notice(e){
  if(!getInit() && !session()){
    V.innerHTML=`<div class="center">Открой это приложение <b>из бота</b> Step Together 🌱
      <br><br><button class="btn-grad" style="max-width:220px;margin:0 auto" onclick="retryInit()">Обновить</button>
      <pre style="text-align:left;white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px">${esc(diagText())}</pre>
      </div>`;
    return;
  }
  V.innerHTML=`<div class="center">Не удалось загрузить 😔<br><br><span class="muted">${esc(e&&e.message||e||"")}</span><br><br><button class="btn-grad" style="max-width:220px;margin:0 auto" onclick="retryInit()">🔄 Обновить</button>
    <pre style="text-align:left;white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px">${esc(diagText())}</pre></div>`;
}
async function retryInit(){
  V.innerHTML=`<div class="spin"></div>`;
  await waitInit(3000);
  loaded.progress=false; V.dataset.tab=""; show("progress");
}

const views={progress:renderProgress,team:renderTeam,board:renderBoard,rules:renderRules,prizes:renderPrizes,faq:renderFAQ,admin:renderAdmin};
const loaded={};
function show(tab){
  document.querySelectorAll(".nav button,.hbtn").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  moveNavInd(tab);
  if(tab!=="admin") backBtn(null);
  if(tab!=="prizes") stopTilt();
  document.body.dataset.tab=tab;
  if(tab==="admin"){ V.dataset.tab=""; ADM.pid=null; renderAdmin(); return; }   // данные P&C — всегда свежие
  if(tab==="rules"||tab==="prizes"||tab==="faq"){ renderGen++; views[tab](); return; }   // статичны — всегда свежие
  if(loaded[tab]&&V.dataset.tab===tab) return;
  V.dataset.tab=tab; loaded[tab]=true; views[tab]();
}
document.querySelectorAll(".nav button,.hbtn").forEach(b=>{
  b.addEventListener("click",()=>{ b.classList.contains("hbtn")?himp():hsel(); V.dataset.tab=""; show(b.dataset.tab); window.scrollTo({top:0}); });
});
// Фактическая высота панели навигации → нижний отступ контента, чтобы кнопки
// в конце страниц никогда не пряталась под панелью (высота зависит от
// платформы, safe-area и масштаба шрифта).
// Капсула под активной вкладкой: сначала растягивается от старой вкладки до
// новой, затем пружиной сжимается на новой — «перетекание» вместо прыжка.
let navCur=null, navT=null;
function moveNavInd(tab, instant=false){
  const ind=document.getElementById("nav-ind"), nav=document.getElementById("nav");
  if(!ind||!nav) return;
  const btn=nav.querySelector(`button[data-tab="${tab}"]`);
  if(!btn){ ind.classList.add("off"); navCur=null; return; }     // вкладки из шапки
  const x=btn.offsetLeft, w=btn.offsetWidth;
  const place=(nx,nw)=>{ ind.style.transform=`translateX(${nx}px)`; ind.style.width=nw+"px"; };
  clearTimeout(navT);
  const prev=navCur&&nav.querySelector(`button[data-tab="${navCur}"]`);
  if(instant||!prev||ind.classList.contains("off")||REDUCED()){
    const t=ind.style.transition; if(instant) ind.style.transition="none";
    place(x,w); ind.classList.remove("off");
    if(instant){ void ind.offsetWidth; ind.style.transition=t; }
  } else if(prev!==btn){
    const a=Math.min(prev.offsetLeft,x), b=Math.max(prev.offsetLeft+prev.offsetWidth,x+w);
    place(a,b-a);                                                   // растянулась на обе
    navT=setTimeout(()=>place(x,w),170);                            // и стекла на новую
  }
  if(prev!==btn){ btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
  navCur=tab;
}

function fitNavPadding(){
  const nav=document.getElementById("nav");
  if(nav) document.documentElement.style.setProperty("--nav-h", nav.offsetHeight+"px");
  if(navCur) moveNavInd(navCur,true);
}
fitNavPadding();
window.addEventListener("resize",fitNavPadding);
document.addEventListener("visibilitychange",()=>document.documentElement.classList.toggle("paused",document.hidden));
try{ document.fonts?.ready.then(()=>{ if(navCur) moveNavInd(navCur,true); }); }catch(e){}
try{ tg?.onEvent?.("viewportChanged",fitNavPadding); }catch(e){}
// Загрузка: если есть Telegram-авторизация или сохранённая сессия — сразу к
// прогрессу; иначе показываем вход по номеру телефона.
async function boot(){
  mark("boot");
  if(!window.Telegram?.WebApp && session()){ show("progress"); return; }
  await waitInit();
  mark("init");
  if(getInit() || session()){ show("progress"); }
  else { renderLogin(); }
}
boot();
</script>
